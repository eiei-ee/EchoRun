name: Three-platform CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: ${{ matrix.testMode }} tests
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Patch Tuanjie project for Unity CI
        shell: bash
        run: |
          sed -i '/cn.tuanjie.codely.bridge/d' Packages/manifest.json
          sed -i '/com.unity.modules.infinity/d' Packages/manifest.json
          cp Packages/packages-lock.unity.json Packages/packages-lock.json
          sed -i 's/2022.3.62t8/2022.3.62f1/g' ProjectSettings/ProjectVersion.txt
          find Assets ProjectSettings -type f \( -name '*.scene' -o -name '*.prefab' -o -name '*.asset' -o -name '*.mat' \) \
            -exec sed -i 's/tag:yousandi.cn,2023:/tag:unity3d.com,2011:/g' {} +

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.62f1
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: artifacts
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.name }}
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebGL
            target: WebGL
            method: BuildConfig.BuildWebGL
            artifact: Builds/WebGL
          - name: Windows
            target: StandaloneWindows64
            method: BuildConfig.BuildWindows
            artifact: Builds/Windows
          - name: Android
            target: Android
            method: BuildConfig.BuildAndroid
            artifact: Builds/Android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Patch Tuanjie project for Unity CI
        shell: bash
        run: |
          sed -i '/cn.tuanjie.codely.bridge/d' Packages/manifest.json
          sed -i '/com.unity.modules.infinity/d' Packages/manifest.json
          cp Packages/packages-lock.unity.json Packages/packages-lock.json
          sed -i 's/2022.3.62t8/2022.3.62f1/g' ProjectSettings/ProjectVersion.txt
          find Assets ProjectSettings -type f \( -name '*.scene' -o -name '*.prefab' -o -name '*.asset' -o -name '*.mat' \) \
            -exec sed -i 's/tag:yousandi.cn,2023:/tag:unity3d.com,2011:/g' {} +

      - name: Build ${{ matrix.name }}
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildMethod: ${{ matrix.method }}
          unityVersion: 2022.3.62f1

      - name: Upload ${{ matrix.name }} build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EchoRun-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
